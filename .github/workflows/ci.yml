name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npx eslint src tests scripts --quiet

      # 常量来源自检：断点令牌与 JS 常量同值、JS 不写字面量断点、@media 宽度已登记
      - name: Check constants
        run: npm run check:constants

      # CSS 设计令牌断档自检：var() 引用了全库未声明且无 fallback 的令牌必红
      # （静默失效 = 亮色碰巧正常、切暗色才暴露，静态闸口是唯一的机器拦截）
      - name: Check CSS tokens
        run: npm run check:css-tokens

      # 语言包对账：zh-CN / en-US 分块与键集一一对应
      - name: Check i18n parity
        run: npm run check:i18n

      # demo 文档表对账：表里不许列组件没有的 prop，也不给必填无默认的 prop 编默认值
      # （这类谎报只有静态闸口拦得住）
      - name: Check demo props tables
        run: npm run check:demo-props

      # 单元测试（带覆盖率地板）。e2e 不在 CI 跑：扫码/相机用例依赖硬件与真实浏览器
      # 环境，由开发本机的 quality-check 兜底；真实云端集成用例（s3-real）靠 skipIf
      # 守卫在此环境自动跳过。
      - name: Unit tests (with coverage floor)
        run: npm run test:unit

      # 按域覆盖防回退（Q4）：全局地板掩盖域级洼地（login 35%、nav 41%…）
      - name: Domain coverage floors
        run: npm run check:coverage-domains

      - name: Build
        run: npm run build

      # 多入口运行时冒烟（Q3）：静态检查之外，双格式真加载 + 导出面与 barrel 一致
      - name: Smoke multi-entry bundles
        run: npm run smoke:entries

      # 发包自检：每个组件都要有 .d.ts、exports 指向的文件都要存在
      - name: Verify package contract
        run: npm run verify:pkg

      # 文档站 API 页漂移闸口（Q9）：改了 props 忘跑 gen:docs 会红
      - name: Check docs drift
        run: npm run check:docs

      # 文档站构建（Q9）：check:docs 只比对源码层，markdown 里的 Vue 模板语法错误
      # （如未转义的 {{ }}）只有真构建才暴露——曾出现「构建坏了但闸口全绿」
      - name: Build docs site
        run: npm run docs:build

      # 防构建期密钥被内联进产物。用假值当金丝雀：本机 .env.local 不在 CI 上，
      # 所以必须在 CI 里也能证明「生产构建不会把 VITE_* 值烧进 dist」这条机制成立。
      - name: Verify env values are not inlined into dist
        env:
          VITE_AMAP_KEY: canary-amap-jskey
          VITE_AMAP_SECRET: canary-amap-security-code
          VITE_SUPABASE_URL: https://canary-project.supabase.co
          VITE_SUPABASE_ANON_KEY: canary-supabase-anon-key
          VITE_SUPABASE_BUCKET: canary-bucket
        run: |
          npm run build
          if grep -rl "canary-" dist/ > /tmp/canary-hit 2>/dev/null && [ -s /tmp/canary-hit ]; then
            echo "::error::构建期环境变量被内联进产物，泄露面见下"
            cat /tmp/canary-hit
            exit 1
          fi
          echo "产物未含任何构建期 env 值"

      - name: Audit (official registry)
        run: npm audit --registry=https://registry.npmjs.org
        continue-on-error: true

      # gitleaks 是 Go 二进制、不经 npm 分发（旧的 npx gitleaks 在 CI 上实际无效）。
      # 用官方 action，扫描结果阻断流水线；audit 的 moderate 噪音仍保留 continue。
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
