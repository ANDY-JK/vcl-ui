name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npx eslint src --quiet

      # 测试用例不入仓库（只留开发本机），所以 CI 上没有可跑的用例：
      # vitest 找不到测试文件会直接 exit 1，playwright 会报 No tests found。
      # 本地门禁仍然完整：npm run quality-check（类型 + lint + 单测/覆盖率 + 构建 + e2e）。

      - name: Build
        run: npm run build

      - name: Audit (official registry)
        run: npm audit --registry=https://registry.npmjs.org
        continue-on-error: true

      - name: Scan for secrets
        run: npx gitleaks detect --source . --no-banner
        continue-on-error: true
