name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npx eslint src --quiet

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit (official registry)
        run: npm audit --registry=https://registry.npmjs.org
        continue-on-error: true

      - name: Check unused deps
        run: npx depcheck
        continue-on-error: true
