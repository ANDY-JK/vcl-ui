name: Release

# 发布流水线：推送 v* 标签时自动发到 npm；手动触发只做预演（打包校验，不上传）。
# 发布前跑一遍与 CI 相同的门禁，任何一项红都不发出去。
#
# 前置条件（各做一次）：
#   1. 仓库推到 GitHub（公开仓库，--provenance 需要）
#   2. 仓库 Settings → Secrets and variables → Actions 加 NPM_TOKEN
#      （npmjs.com → Access Tokens → Generate New Token → Automation）
#   3. 发版：npm version patch|minor|major && git push --follow-tags

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只预演（打包校验，不上传）'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance（来源证明）需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # 标签必须等于 package.json 的 version，防止错版发布
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::标签 v$tag 与 package.json version $pkg 不一致，拒绝发布"
            exit 1
          fi
          echo "版本一致：$pkg"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npx eslint src --quiet

      # 用金丝雀值重建一次，证明构建期 env 不会烧进产物；随后清掉，正式构建不带任何 env 值
      - name: Verify env values are not inlined into dist
        env:
          VITE_AMAP_KEY: canary-amap-jskey
          VITE_AMAP_SECRET: canary-amap-security-code
          VITE_SUPABASE_URL: https://canary-project.supabase.co
          VITE_SUPABASE_ANON_KEY: canary-supabase-anon-key
          VITE_SUPABASE_BUCKET: canary-bucket
        run: |
          npm run build
          if grep -rl "canary-" dist/ > /tmp/canary-hit 2>/dev/null && [ -s /tmp/canary-hit ]; then
            echo "::error::构建期环境变量被内联进产物"
            cat /tmp/canary-hit
            exit 1
          fi
          rm -rf dist
          echo "产物未含任何构建期 env 值"

      - name: Build (release)
        run: npm run build

      - name: Verify package contract
        run: npm run verify:pkg

      - name: Dry run (manual trigger)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::缺少仓库 Secret NPM_TOKEN，见本文件头部说明"
            exit 1
          fi
          npm publish --access public --provenance
